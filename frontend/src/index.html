<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Hucha · Banca digital</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Hucha: banca digital de demostración hecha con Spring Boot y Angular"
    />
    <meta name="theme-color" content="#f2efe7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141310" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // Aplica el tema antes de pintar para que no haya parpadeo.
      (function () {
        try {
          var saved = localStorage.getItem('hucha:theme');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset['theme'] = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
