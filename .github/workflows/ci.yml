name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      # En los runners de GitHub hay Docker: el test con Testcontainers prueba las migraciones en PostgreSQL real.
      - name: Tests y cobertura
        run: ./mvnw -B verify
      - name: Informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: backend/target/site/jacoco
          if-no-files-found: ignore

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Formato
        run: npx prettier --check "src/**/*.{ts,html,css}"
      - name: Tests
        run: npm run test:ci
      - name: Build de producción
        run: npx ng build

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Construir backend y frontend
        run: docker compose build
        env:
          POSTGRES_PASSWORD: ci
          JWT_SECRET: ci-secret-de-al-menos-treinta-y-dos-caracteres
